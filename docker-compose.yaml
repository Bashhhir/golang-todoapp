services:
  todoapp-postgres:
    image: postgres:18.1-bookworm
    container_name: todoapp-env-postgres
    environment:
      POSTGRES_DB: test-db
      POSTGRES_USER: test-user-123
      POSTGRES_PASSWORD: test-postgres-password-456
    volumes:
      - ./out/pgdata:/var/lib/postgresql
    restart: always

  todoapp-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.0.3
    command:
      - tcp-listen:5432,fork,reuseaddr
      - tcp-connect:todoapp-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"